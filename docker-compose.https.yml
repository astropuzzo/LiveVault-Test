services:
  caddy:
    image: caddy:2-alpine
    container_name: livevault-caddy
    restart: unless-stopped
    depends_on:
      livevault:
        condition: service_healthy
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
