name: Sync LiveVault v2 payload
on:
  push:
    branches: [main]
    paths:
      - '.sync-v2/**'
      - '.github/workflows/sync-v2.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract v2 payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/livevault-v2
          cat .sync-v2/part* | base64 -d > /tmp/livevault-v2.tar.gz
          tar -xzf /tmp/livevault-v2.tar.gz -C /tmp/livevault-v2
          cp -a /tmp/livevault-v2/LiveVault/. .
          rm -rf .sync-v2 .github/workflows/sync-v2.yml
      - name: Commit v2 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release LiveVault v2.0.0'
          git push origin HEAD:main
