name: Apply v2.8.9 FFmpeg fix

on:
  push:
    branches:
      - feature/v2.8.9-regional-egress

permissions:
  contents: write

concurrency:
  group: livevault-v289-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply patch
        run: python scripts/apply_v289_ffmpeg_hls_fix.py
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run tests
        run: PYTHONPATH=. pytest -q
      - name: Check JavaScript
        run: node --check app/static/app.js
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Commit verified patch
        run: |
          rm scripts/apply_v289_ffmpeg_hls_fix.py .github/workflows/v289-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(recorder): avoid reconnect options on local HLS master"
          git push origin "HEAD:${GITHUB_REF_NAME}"
