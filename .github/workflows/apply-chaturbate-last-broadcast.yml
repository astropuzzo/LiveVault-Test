name: Apply Chaturbate last broadcast patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/_apply_chaturbate_last_broadcast.py'
      - '.github/workflows/apply-chaturbate-last-broadcast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply patch
        run: python scripts/_apply_chaturbate_last_broadcast.py
      - name: Validate
        run: |
          python -m compileall -q app tests
          python -m pytest -q tests/test_source_platform_metadata.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/source_providers.py app/workers.py app/main.py tests/test_source_platform_metadata.py VERSION CHANGELOG.md
          git commit -m 'fix(chaturbate): show platform last broadcast time'
          git push origin HEAD:main
