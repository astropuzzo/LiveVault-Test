name: Apply v2.8.12 exact patch

on:
  push:
    branches:
      - codex/v2.8.12-control-room

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v2.8.12-control-room
          fetch-depth: 0
      - name: Apply exact tested patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/livevault-v2812.patch.xz.b64 | xz -d > /tmp/livevault-v2812.patch
          git apply --check --unidiff-zero /tmp/livevault-v2812.patch
          git apply --unidiff-zero /tmp/livevault-v2812.patch
          git add CHANGELOG.md app/main.py app/recorder.py app/static/app.js app/static/enhancements.css app/static/index.html app/workers.py tests/test_live_pulse_ui.py tests/test_v2812_recovery_visibility.py tests/test_v288_session_stitching.py tests/test_worker_monitoring.py
          git rm .github/livevault-v2812.patch.xz.b64 .github/workflows/apply-v2812-patch.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finish v2.8.12 recovery and recording ordering"
          git push origin HEAD:codex/v2.8.12-control-room
