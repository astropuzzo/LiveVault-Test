name: Publish LiveVault v2 source

on:
  push:
    branches: [main]
    paths:
      - '.sync-v2-new/**'
      - '.github/workflows/sync-v2-clean.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/livevault-v2 /tmp/livevault-workflows
          cat .sync-v2-new/part* | base64 -d > /tmp/livevault-v2.tar.gz
          echo '8a0024e9bf98da2c160bc8196f7af97bacf6131fa209a0a21dcb672261faa8bc  /tmp/livevault-v2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/livevault-v2.tar.gz -C /tmp/livevault-v2

      - name: Publish source without rewriting workflows
        run: |
          set -euo pipefail
          cp -a .github/workflows/. /tmp/livevault-workflows/
          cp -a /tmp/livevault-v2/LiveVault/. .
          rm -rf .sync-v2 .sync-v2-new
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/livevault-workflows/. .github/workflows/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish LiveVault v2.0.0 source'
          git push origin HEAD:main
