name: Clean sync LiveVault v2

on:
  push:
    branches: [main]
    paths:
      - '.sync-v2-new/**'
      - '.github/workflows/sync-v2-clean.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/livevault-v2
          cat .sync-v2-new/part* | base64 -d > /tmp/livevault-v2.tar.gz
          echo '8a0024e9bf98da2c160bc8196f7af97bacf6131fa209a0a21dcb672261faa8bc  /tmp/livevault-v2.tar.gz' | sha256sum -c -
          tar -xzf /tmp/livevault-v2.tar.gz -C /tmp/livevault-v2
          cp -a /tmp/livevault-v2/LiveVault/. .

      - name: Test exact v2 source including Codespaces path
        run: |
          set -euo pipefail
          python -m json.tool .devcontainer/devcontainer.json >/dev/null
          bash -n scripts/*.sh
          bash scripts/codespaces-prepare.sh
          . .venv/bin/activate
          python -m compileall -q app tests
          PYTHONPATH=. pytest -q
          node --check app/static/app.js
          bash scripts/codespaces-smoke.sh

      - name: Commit tested v2 source
        run: |
          set -euo pipefail
          rm -rf .sync-v2 .sync-v2-new
          rm -f .github/workflows/sync-v2.yml .github/workflows/sync-v2-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release LiveVault v2.0.0 with Codespaces smoke tests'
          git push origin HEAD:main

# Second clean run: no repository mutations will occur while this job is running.
