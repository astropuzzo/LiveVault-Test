name: Stage v2.8.8 Session Stitching

on:
  push:
    branches:
      - feature/v2.8.8-session-stitching

permissions:
  contents: write

concurrency:
  group: stage-v288-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply session stitching patch
        run: python scripts/apply_v288_session_stitching.py
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run full tests
        run: PYTHONPATH=. pytest -q
      - name: Check JavaScript
        run: node --check app/static/app.js
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Publish clean branch
        run: |
          rm -f scripts/apply_v288_session_stitching.py
          rm -f .github/workflows/stage-v288-session-stitching.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "feat(recorder): stitch reconnects into logical sessions"
          git push origin HEAD:feature/v2.8.8-session-stitching
