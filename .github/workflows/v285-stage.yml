name: v2.8.5 staging

on:
  push:
    branches:
      - feature/v2.8.5-daily-cloud

permissions:
  contents: write

concurrency:
  group: livevault-v285-stage
  cancel-in-progress: true

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply v2.8.5 A/V fix
        run: |
          python scripts/apply_v285_av_integrity.py
          python scripts/fix_v285_release_test.py
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run tests
        run: PYTHONPATH=. pytest -q
      - name: Check JavaScript
        run: node --check app/static/app.js
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Publish clean branch
        run: |
          rm -f scripts/apply_v285_av_integrity.py scripts/fix_v285_release_test.py .github/workflows/v285-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish"
          else
            git commit -m "fix(recorder): harden live A/V timing"
            git push origin HEAD:feature/v2.8.5-daily-cloud
          fi
