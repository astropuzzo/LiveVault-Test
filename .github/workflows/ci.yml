name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: livevault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply FFmpeg local HLS hotfix
        if: github.event_name == 'push' && github.ref == 'refs/heads/hotfix/ffmpeg-local-hls-headers'
        run: python scripts/apply_ffmpeg_local_hls_headers_hotfix.py
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run tests
        run: PYTHONPATH=. pytest -q
      - name: Check JavaScript
        run: node --check app/static/app.js
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Publish verified hotfix commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/hotfix/ffmpeg-local-hls-headers'
        run: |
          if git diff --quiet; then
            echo "No hotfix changes found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(recorder): never bind HTTP AVOptions to local HLS master"
          git push origin HEAD:hotfix/ffmpeg-local-hls-headers

  deploy:
    name: Deploy verified main
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ask CapRover to deploy the latest verified main
        env:
          CAPROVER_DEPLOY_WEBHOOK: ${{ secrets.CAPROVER_DEPLOY_WEBHOOK }}
        run: >-
          curl --fail --show-error --silent
          --retry 3 --retry-all-errors --max-time 30
          --request POST "$CAPROVER_DEPLOY_WEBHOOK"
