name: CI

on:
  push:
  pull_request:

concurrency:
  group: livevault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app control-panel tests
      - name: Run tests
        run: PYTHONPATH=. pytest -q
      - name: Check JavaScript
        run: |
          for file in app/static/*.js control-panel/static/*.js; do node --check "$file"; done
          node --test tests/test_panel_frontend.cjs
      - name: Check shell scripts
        run: |
          for file in scripts/*.sh control-panel/openastro-action control-panel/openastro-power-profile; do bash -n "$file"; done
