name: Apply v2.9.0 Regional Egress

on:
  push:
    branches:
      - feature/v2.9.0-regional-egress

permissions:
  contents: write

concurrency:
  group: livevault-v290-apply
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply patch
        run: python scripts/apply_v290_regional_egress.py
      - name: Compile Python
        run: python -m compileall -q app tests
      - name: Run tests
        run: PYTHONPATH=. pytest -q
      - name: Check JavaScript
        run: node --check app/static/app.js
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Build production image
        run: docker build --pull -t livevault-v290-ci .
      - name: Verify wireproxy binary
        run: docker run --rm --entrypoint /usr/local/bin/wireproxy livevault-v290-ci --version
      - name: Commit verified patch
        run: |
          rm scripts/apply_v290_regional_egress.py .github/workflows/v290-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(network): LiveVault v2.9.0 regional egress"
          git push origin "HEAD:${GITHUB_REF_NAME}"
