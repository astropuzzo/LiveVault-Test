name: Apply local cleanup patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/_apply_local_cleanup_patch.py'
      - '.github/workflows/apply-local-cleanup-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/_apply_local_cleanup_patch.py
      - name: Syntax checks
        run: |
          python -m compileall -q app tests
          node --check app/static/app.js
          python -m pytest -q tests/test_file_cleanup.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/main.py app/file_cleanup.py app/static/app.js app/static/index.html app/static/sw.js tests/test_file_cleanup.py VERSION CHANGELOG.md
          git commit -m 'fix(storage): delete local files and purge orphans'
          git push origin HEAD:main
