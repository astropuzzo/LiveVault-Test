services:
  billing:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 268435456
    memswap_limit: 268435456
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      BILLING_ENABLED: "${BILLING_ENABLED:-false}"
      PORT: "8095"
      DATABASE_PATH: /data/bonsai-sensei/billing.sqlite3
      CATALOG_PATH: /config/catalog.json
      PLAY_PACKAGE_NAME: ${PLAY_PACKAGE_NAME:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/play-service-account.json
      ACCOUNT_HMAC_KEY_FILE: /run/secrets/account-hmac.key
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token-encryption.key
      RTDN_AUDIENCE: ${RTDN_AUDIENCE:-}
      RTDN_SERVICE_ACCOUNT_EMAIL: ${RTDN_SERVICE_ACCOUNT_EMAIL:-}
      RTDN_SUBSCRIPTION: ${RTDN_SUBSCRIPTION:-}
    volumes:
      # Coolify 4.4.2 parser v5 preserves :ro but drops long-form bind read_only.
      - /data/bonsai-sensei:/data/bonsai-sensei
      - /data/bonsai-sensei-config:/config:ro
      - /data/bonsai-sensei-secrets:/run/secrets:ro
