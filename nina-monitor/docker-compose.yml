services:
  nina-monitor:
    build:
      context: .
    container_name: openastro-nina-monitor
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${NINA_MONITOR_BIND_ADDR:-0.0.0.0}:${NINA_MONITOR_PORT:-9091}:9091"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.75
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9091/healthz', timeout=2).read()"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s
