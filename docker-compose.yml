services:
  livevault:
    build: .
    container_name: livevault
    restart: unless-stopped
    env_file: .env
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${BIND_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
